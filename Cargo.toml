[workspace]
resolver = "2"
members = ["blur_plugin","image_processor", "mirror_plugin", "plugin_interface"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
image = {version = "0.25"}
libloading = {version = "0.9"}
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

plugin_interface = { path = "plugin_interface" }